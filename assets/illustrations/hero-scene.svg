<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780">
<style>
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud--b{animation-duration:12s;animation-delay:-4s}
.cloud--c{animation-duration:10s;animation-delay:-7s}
.plane{animation:glide 5.5s ease-in-out infinite alternate}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.spark--b{animation-delay:-1.6s}
.sun-halo{transform-box:fill-box;transform-origin:center;animation:halo 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
@keyframes glide{from{transform:translate(0,0) rotate(-2deg)}to{transform:translate(8px,-10px) rotate(2deg)}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.6}}
@keyframes halo{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.cloud,.plane,.spark,.sun-halo{animation:none}}
</style>
<defs>

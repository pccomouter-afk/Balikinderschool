<div class="chat" id="chat">
  <section
    class="chat__panel"
    id="chat-panel"
    role="dialog"
    aria-label="Asisten BGKS"
    hidden
  >
    <div class="chat__head">
      <div>
        <h2>Asisten BGKS</h2>
        <p>Jawaban singkat untuk pertanyaan umum. Bukan layanan AI.</p>
      </div>
      <button class="chat__close" type="button" aria-label="Tutup percakapan">
        &times;
      </button>
    </div>
    <div
      class="chat__log"
      id="chat-log"
      role="log"
      aria-live="polite"
      aria-label="Percakapan"
    ></div>
    <div class="chat__quick">
      <button
        class="chat__quick-toggle"
        id="chat-quick-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="chat-chips"
      >
        <span>Pertanyaan cepat</span
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 15l6-6 6 6" />
        </svg>
      </button>
      <div class="chat__chips" id="chat-chips">
        <button class="chat__chip" type="button">
          Bagaimana cara pendaftaran?
        </button>
        <button class="chat__chip" type="button">
          Program apa saja yang tersedia?
        </button>
        <button class="chat__chip" type="button">
          Bagaimana cara mengenal sekolah?
        </button>
        <button class="chat__chip" type="button">
          Bagaimana cara menghubungi admin?
        </button>
      </div>
    </div>
    <form class="chat__form" id="chat-form">
      <label class="sr-only" for="chat-input">Pertanyaan</label
      ><input
        id="chat-input"
        type="text"
        autocomplete="off"
        placeholder="Tulis pertanyaan"
      /><button type="submit" aria-label="Kirim pertanyaan">Kirim</button>
    </form>
    <div class="chat__contact">
      <a
        class="btn btn--primary"
        id="chat-wa"
        target="_blank"
        rel="noopener"
        hidden
        >Hubungi Admin via WhatsApp</a
      >
      <p id="chat-wa-note">
        Nomor WhatsApp admin belum dikonfigurasi. Hubungi sekolah lewat
        <a
          href="https://www.instagram.com/baliglobalkinderschool/"
          target="_blank"
          rel="noopener"
          >Instagram resmi</a
        >.
      </p>
    </div>
  </section>
  <button
    class="chat__toggle"
    id="chat-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="chat-panel"
    aria-label="Buka asisten BGKS"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
    </svg>
  </button>
</div>
